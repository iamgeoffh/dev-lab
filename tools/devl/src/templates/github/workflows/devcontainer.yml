name: Development container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify rootless Podman
        run: |
          set -euo pipefail
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true

      - name: Build development image
        run: |
          set -euo pipefail
          podman build \
            --tag localhost/{{PROJECT_NAME}}-agent-dev:ci \
            --file .devcontainer/Containerfile \
            .

      - name: Run project checks
        run: |
          set -euo pipefail
          podman run --rm \
            --user dev \
            --workdir /workspace \
            --volume "${GITHUB_WORKSPACE}:/workspace:Z" \
            localhost/{{PROJECT_NAME}}-agent-dev:ci \
            bash -lc \
              'mise trust --yes /workspace/mise.toml && mise install --yes --locked just && mise exec --cd /workspace -- just check'

